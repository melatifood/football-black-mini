<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Football Black Mini (Classic Retro Edition)</title>
    <style>
        body {
            margin: 0;
            padding: 0;
            background-color: #000;
            color: #fff;
            font-family: monospace;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            height: 100vh;
            overflow: hidden;
            touch-action: none;
        }
        #game-wrapper {
            text-align: center;
            border: 2px solid #555;
            background: #111;
            padding: 10px;
            box-shadow: 0 0 15px rgba(255,255,255,0.1);
        }
        canvas {
            display: block;
            background: #000;
            border: 1px solid #fff;
            margin: 0 auto;
        }
        .header-info {
            display: flex;
            justify-content: space-between;
            width: 320px;
            margin: 5px auto;
            font-size: 16px;
            font-weight: bold;
        }
        .controls {
            margin-top: 10px;
            display: flex;
            justify-content: center;
            gap: 15px;
        }
        button {
            background: #222;
            color: #fff;
            border: 1px solid #fff;
            padding: 10px 20px;
            font-size: 14px;
            cursor: pointer;
        }
        button:active {
            background: #444;
        }
    </style>
</head>
<body>

    <div id="game-wrapper">
        <div style="font-size: 14px; margin-bottom: 5px; color: #aaa;">FOOTBALL BLACK MINI</div>
        <div class="header-info">
            <span id="score">SKOR: 0</span>
            <span id="lives">NYAWA: 3</span>
        </div>
        <canvas id="gameCanvas" width="320" height="480"></canvas>
        <div class="controls">
            <button id="left-btn">&lt;&lt; KIRI</button>
            <button id="right-btn">KANAN &gt;&gt;</button>
        </div>
    </div>

    <script>
        const canvas = document.getElementById('gameCanvas');
        const ctx = canvas.getContext('2d');

        let score = 0;
        let lives = 3;

        let ball = { x: 160, y: 100, radius: 8, vx: 2, vy: 3 };
        let paddle = { x: 130, y: 440, width: 60, height: 12 };

        const kickSound = new Audio('kick.ogg');
        const crowdSound = new Audio('ohhcrowd.ogg');
        const tapSound = new Audio('balltap.ogg');

        let leftPressed = false;
        let rightPressed = false;

        function resetBall() {
            ball.x = 160;
            ball.y = 100;
            ball.vx = (Math.random() > 0.5 ? 1 : -1) * (2 + Math.random() * 2);
            ball.vy = 3 + Math.random() * 2;
        }

        function update() {
            ball.x += ball.vx;
            ball.y += ball.vy;

            if (ball.x - ball.radius < 0 || ball.x + ball.radius > canvas.width) {
                ball.vx *= -1;
            }
            if (ball.y - ball.radius < 0) {
                ball.vy *= -1;
            }

            if (leftPressed && paddle.x > 0) {
                paddle.x -= 6;
            }
            if (rightPressed && paddle.x + paddle.width < canvas.width) {
                paddle.x += 6;
            }

            if (
                ball.y + ball.radius >= paddle.y &&
                ball.y - ball.radius <= paddle.y + paddle.height &&
                ball.x >= paddle.x &&
                ball.x <= paddle.x + paddle.width
            ) {
                try { tapSound.play(); } catch(e){}
                ball.vy *= -1.05;
                score += 1;
                document.getElementById('score').innerText = 'SKOR: ' + score;
            }

            if (ball.y > canvas.height) {
                try { crowdSound.play(); } catch(e){}
                lives--;
                document.getElementById('lives').innerText = 'NYAWA: ' + lives;
                if (lives <= 0) {
                    alert('GAME OVER! Skor Anda: ' + score);
                    score = 0;
                    lives = 3;
                    document.getElementById('score').innerText = 'SKOR: ' + score;
                    document.getElementById('lives').innerText = 'NYAWA: ' + lives;
                }
                resetBall();
            }
        }

        function draw() {
            ctx.fillStyle = '#000';
            ctx.fillRect(0, 0, canvas.width, canvas.height);

            ctx.strokeStyle = '#fff';
            ctx.lineWidth = 2;
            ctx.strokeRect(10, 10, canvas.width - 20, canvas.height - 20);

            ctx.beginPath();
            ctx.moveTo(10, canvas.height / 2);
            ctx.lineTo(canvas.width - 10, canvas.height / 2);
            ctx.setLineDash([4, 4]);
            ctx.strokeStyle = '#444';
            ctx.stroke();
            ctx.setLineDash([]);

            ctx.beginPath();
            ctx.arc(ball.x, ball.y, ball.radius, 0, Math.PI * 2);
            ctx.fillStyle = '#fff';
            ctx.fill();
            ctx.lineWidth = 1;
            ctx.strokeStyle = '#000';
            ctx.stroke();
            ctx.closePath();

            ctx.fillStyle = '#fff';
            ctx.fillRect(paddle.x, paddle.y, paddle.width, paddle.height);
        }

        function loop() {
            update();
            draw();
            requestAnimationFrame(loop);
        }

        const leftBtn = document.getElementById('left-btn');
        const rightBtn = document.getElementById('right-btn');

        leftBtn.addEventListener('mousedown', () => leftPressed = true);
        leftBtn.addEventListener('mouseup', () => leftPressed = false);
        leftBtn.addEventListener('touchstart', (e) => { e.preventDefault(); leftPressed = true; });
        leftBtn.addEventListener('touchend', (e) => { e.preventDefault(); leftPressed = false; });

        rightBtn.addEventListener('mousedown', () => rightPressed = true);
        rightBtn.addEventListener('mouseup', () => rightPressed = false);
        rightBtn.addEventListener('touchstart', (e) => { e.preventDefault(); rightPressed = true; });
        rightBtn.addEventListener('touchend', (e) => { e.preventDefault(); rightPressed = false; });

        requestAnimationFrame(loop);
    </script>
</body>
</html>
