<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Football Black Mini - Enhanced Edition</title>
    <style>
        body {
            background-color: #111;
            color: #fff;
            font-family: Arial, sans-serif;
            text-align: center;
            margin: 0;
            padding: 20px;
        }
        h1 { color: #f39c12; }
        canvas {
            background: #27ae60;
            border: 4px solid #fff;
            border-radius: 8px;
            box-shadow: 0 0 20px rgba(0,0,0,0.8);
            display: block;
            margin: 20px auto;
            max-width: 100%;
        }
        .btn {
            background: #e74c3c;
            color: white;
            border: none;
            padding: 10px 20px;
            font-size: 16px;
            cursor: pointer;
            border-radius: 5px;
            margin: 5px;
        }
        .btn:hover { background: #c0392b; }
    </style>
</head>
<body>
    <h1>⚽ Football Black Mini: Enhanced Edition</h1>
    <p>Gunakan Tombol Panah / Sentuh untuk Mengontrol Penjaga Gawang & Menepis Bola!</p>
    
    <div>
        <strong>Skor: <span id="score">0</span></strong> | <strong>Nyawa: <span id="lives">3</span></strong>
    </div>

    <canvas id="gameCanvas" width="400" height="500"></canvas>
    
    <div>
        <button class="btn" onclick="moveLeft()">← Kiri</button>
        <button class="btn" onclick="moveRight()">Kanan →</button>
    </div>

    <script>
        const canvas = document.getElementById("gameCanvas");
        const ctx = canvas.getContext("2d");

        let score = 0;
        let lives = 3;

        let ball = { x: 180, y: 520, radius: 14, vx: 0, vy: 0 };
        let goal = { x: 110, y: 80, width: 140, height: 60 };
        let goalkeeper = { x: 160, y: 100, width: 40, height: 20, vx: 2 };
        let arrowAngle = 0;

        function update() {
            ball.x += ball.speedX;
            ball.y += ball.speedY;

            // Pantulan dinding
            if (ball.x - ball.radius < 0 || ball.x + ball.radius > canvas.width) {
                ball.speedX = -ball.speedX;
            }
            if (ball.y - ball.radius < 0) {
                ball.speedY = -ball.speedY;
            }

            // Tangkapan kiper
            if (
                ball.y + ball.radius >= keeper.y &&
                ball.x >= keeper.x &&
                ball.x <= keeper.x + keeper.width &&
                ball.speedY > 0
            ) {
                ball.speedY = -ball.speedY * 1.05;
                score += 10;
                document.getElementById("score").innerText = score;
            }

            // Bola lewat / kebobolan
            if (ball.y > canvas.height) {
                lives--;
                document.getElementById("lives").innerText = lives;
                resetBall();
                if (lives <= 0) {
                    alert("Game Over! Skor Akhir Anda: " + score);
                    score = 0;
                    lives = 3;
                    document.getElementById("score").innerText = score;
                    document.getElementById("lives").innerText = lives;
                }
            }
        }

        function resetBall() {
            ball.x = Math.random() * (canvas.width - 100) + 50;
            ball.y = 50;
            ball.speedY = 4;
            ball.speedX = (Math.random() - 0.5) * 6;
        }

        function draw() {
            ctx.clearRect(0, 0, canvas.width, canvas.height);

            // Garis gawang / lapangan
            ctx.strokeStyle = "#fff";
            ctx.lineWidth = 3;
            ctx.strokeRect(50, 0, 300, 150);

            // Gambar Bola
            ctx.beginPath();
            ctx.arc(ball.x, ball.y, ball.radius, 0, Math.PI * 2);
            ctx.fillStyle = "#fff";
            ctx.fill();
            ctx.closePath();

            // Gambar Kiper
            ctx.fillStyle = "#e74c3c";
            ctx.fillRect(keeper.x, keeper.y, keeper.width, keeper.height);
        }

        function loop() {
            update();
            draw();
            requestAnimationFrame(loop);
        }

        function moveLeft() {
            keeper.x = Math.max(0, keeper.x - keeper.speed);
        }

        function moveRight() {
            keeper.x = Math.min(canvas.width - keeper.width, keeper.x + keeper.speed);
        }

        window.addEventListener("keydown", (e) => {
            if (e.key === "ArrowLeft") moveLeft();
            if (e.key === "ArrowRight") moveRight();
        });

        loop();
    </script>
</body>
</html>
