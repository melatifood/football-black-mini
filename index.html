<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>City Block - Stack Builder</title>
    <style>
        body {
            margin: 0;
            padding: 0;
            background-color: #1a1a2e;
            color: #fff;
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            height: 100vh;
            overflow: hidden;
            touch-action: none;
        }
        #game-wrapper {
            text-align: center;
            border: 4px solid #e94560;
            background: #0f3460;
            padding: 15px;
            border-radius: 12px;
            box-shadow: 0 0 25px rgba(233, 69, 96, 0.4);
        }
        canvas {
            display: block;
            background: #162447;
            border: 2px solid #e94560;
            border-radius: 6px;
            margin: 0 auto;
        }
        .header-info {
            display: flex;
            justify-content: space-between;
            width: 320px;
            margin: 10px auto;
            font-size: 18px;
            font-weight: bold;
            color: #e4e4e4;
        }
        .controls {
            margin-top: 15px;
            display: flex;
            justify-content: center;
            gap: 20px;
        }
        button {
            background: #e94560;
            color: #fff;
            border: none;
            padding: 12px 28px;
            font-size: 16px;
            font-weight: bold;
            border-radius: 6px;
            cursor: pointer;
            box-shadow: 0 4px #903749;
        }
        button:active {
            transform: translateY(4px);
            box-shadow: 0 0 #903749;
        }
    </style>
</head>
<body>

    <div id="game-wrapper">
        <div style="font-size: 18px; margin-bottom: 5px; color: #e94560; font-weight: bold;">🏙️ CITY BLOCK STACKER</div>
        <div class="header-info">
            <span id="score">SKOR: 0</span>
            <span id="best">TERTINGGI: 0</span>
        </div>
        <canvas id="gameCanvas" width="320" height="440"></canvas>
        <div class="controls">
            <button id="drop-btn">JATUHKAN BLOK 🏗️</button>
        </div>
    </div>

    <script>
        const canvas = document.getElementById('gameCanvas');
        const ctx = canvas.getContext('2d');

        let score = 0;
        let bestScore = 0;
        let stack = [];
        let currentBlock = { x: 50, y: 50, width: 120, height: 25, vx: 3, color: '#e94560' };
        let cameraY = 0;
        let gameRunning = true;

        const colors = ['#e94560', '#f9ed69', '#f08a5d', '#b83b5e', '#6c5ce7', '#00b894'];

        function initGame() {
            stack = [{ x: 100, y: 380, width: 120, height: 25, color: '#00b894' }];
            score = 0;
            document.getElementById('score').innerText = 'SKOR: ' + score;
            spawnBlock();
        }

        function spawnBlock() {
            let lastBlock = stack[stack.length - 1];
            let newWidth = lastBlock.width;
            currentBlock = {
                x: 0,
                y: lastBlock.y - 30,
                width: newWidth,
                height: 25,
                vx: 3 + Math.floor(score / 5),
                color: colors[stack.length % colors.length]
            };
        }

        function dropBlock() {
            if (!gameRunning) {
                gameRunning = true;
                initGame();
                return;
            }

            let lastBlock = stack[stack.length - 1];
            let diff = currentBlock.x - lastBlock.x;

            if (Math.abs(diff) >= currentBlock.width) {
                gameRunning = false;
                alert('GAME OVER! Blok meleset. Skor Anda: ' + score);
                if (score > bestScore) {
                    bestScore = score;
                    document.getElementById('best').innerText = 'TERTINGGI: ' + bestScore;
                }
                return;
            }

            // Trim block
            if (diff > 0) {
                currentBlock.width -= diff;
            } else {
                currentBlock.width += diff;
                currentBlock.x = lastBlock.x + diff;
            }

            stack.push({ ...currentBlock });
            score++;
            document.getElementById('score').innerText = 'SKOR: ' + score;

            if (stack.length > 10) {
                stack.shift();
                stack.forEach(b => b.y += 30);
            }

            spawnBlock();
        }

        function update() {
            if (!gameRunning) return;

            currentBlock.x += currentBlock.vx;
            if (currentBlock.x <= 0 || currentBlock.x + currentBlock.width >= canvas.width) {
                currentBlock.vx *= -1;
            }
        }

        function draw() {
            ctx.fillStyle = '#162447';
            ctx.fillRect(0, 0, canvas.width, canvas.height);

            // Draw stack
            stack.forEach(b => {
                ctx.fillStyle = b.color;
                ctx.fillRect(b.x, b.y, b.width, b.height);
                ctx.strokeStyle = '#fff';
                ctx.lineWidth = 1;
                ctx.strokeRect(b.x, b.y, b.width, b.height);
            });

            // Draw moving block
            if (gameRunning) {
                ctx.fillStyle = currentBlock.color;
                ctx.fillRect(currentBlock.x, currentBlock.y, currentBlock.width, currentBlock.height);
                ctx.strokeStyle = '#fff';
                ctx.lineWidth = 1;
                ctx.strokeRect(currentBlock.x, currentBlock.y, currentBlock.width, currentBlock.height);
            }
        }

        function loop() {
            update();
            draw();
            requestAnimationFrame(loop);
        }

        document.getElementById('drop-btn').addEventListener('click', dropBlock);
        window.addEventListener('keydown', (e) => {
            if (e.key === ' ' || e.key === 'ArrowDown') {
                dropBlock();
            }
        });

        initGame();
        requestAnimationFrame(loop);
    </script>
</body>
</html>
